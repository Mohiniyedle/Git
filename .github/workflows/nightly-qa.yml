name: Selenium QA Automation

on:
  repository_dispatch:
    types: [run-qa-suite]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Google Chrome
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # Install ChromeDriver
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # Verify installations
      - name: Verify Chrome & Driver
        run: |
          google-chrome --version
          chromedriver --version

      # Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # If requirements.txt exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Create folders for reports/screenshots
      - name: Create Result Directories
        run: |
          mkdir -p screenshots
          mkdir -p reports

      # Run Selenium Automation
      - name: Execute Selenium Test Suite
        run: |
          pycharm test_login.py

      # Upload screenshots and reports
      - name: Upload Automation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: |
            screenshots/
            reports/
